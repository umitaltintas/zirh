<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ZIRH testleri</title></head>
<body style="margin:0;font:13px/1.5 monospace">
<div id="out">çalışıyor…</div>
<script>
var lines = [], pass = 0, fail = 0;

function ok(name, cond, detail){
  if(cond){ pass++; lines.push("PASS  " + name); }
  else { fail++; lines.push("FAIL  " + name + (detail ? "  → " + detail : "")); }
}

function frame(w, h){
  return new Promise(function(res){
    var f = document.createElement("iframe");
    f.style.cssText = "width:" + w + "px;height:" + h + "px;border:0;position:absolute;left:-9999px";
    f.src = "./index.html?t=" + Math.random();
    f.onload = function(){ setTimeout(function(){ res(f); }, 700); };
    document.body.appendChild(f);
  });
}

function visibleViews(d){
  var ids = ["antrenman","ogun","gecmis","rehber","profil"], on = [];
  ids.forEach(function(v){
    var el = d.getElementById("v-" + v);
    if(d.defaultView.getComputedStyle(el).display !== "none") on.push(v);
  });
  return on;
}

function hiddenBoxes(d, active){
  var ids = ["antrenman","ogun","gecmis","rehber","profil"], bad = [];
  ids.forEach(function(v){
    if(v === active) return;
    var r = d.getElementById("v-" + v).getBoundingClientRect();
    if(r.width !== 0 || r.height !== 0) bad.push(v + " " + Math.round(r.width) + "x" + Math.round(r.height));
  });
  return bad;
}

function run(){
  localStorage.clear();

  /* ---- 1. varsayılan telefon ---- */
  return frame(390, 844).then(function(f){
    var d = f.contentDocument, w = f.contentWindow;

    ok("5 sekme var", d.querySelectorAll('[role="tab"]').length === 5);
    ok("1. seviyede 2 gün", d.querySelectorAll('#days [data-day]').length === 2);
    ok("6 hareket sayfası", d.querySelectorAll(".page.dyn").length === 6);

    /* ---- ısınma ve soğuma ---- */
    ok("ısınma listesi dolduruldu", d.querySelectorAll("#warm [data-warm]").length === 4,
       d.querySelectorAll("#warm [data-warm]").length + " satır");
    ok("ısınma günün ilk hareketini adıyla söylüyor",
       /Leg Press/.test(d.querySelector('#warm [data-warm="first-move"]').textContent),
       d.querySelector('#warm [data-warm="first-move"]').textContent);

    /* Isınma paneli teknik panelinden önce deneniyor: panel kapatma
       history.back() çağırıyor ve test sayfasını da geri götürüyor. */
    d.querySelector('#warm [data-warm="wall-angel"]').click();
    ok("ısınma paneli açıldı", d.getElementById("sheet").classList.contains("on"));
    var wslot = d.querySelector("#sheet-body .videoslot");
    ok("ısınma hareketinin videosu bağlı",
       !!wslot && /^[A-Za-z0-9_-]{11}$/.test(wslot.dataset.vid),
       wslot ? wslot.dataset.vid : "yok");
    ok("ısınma panelinde teknik adımları var", d.querySelectorAll("#sheet-body ol li").length >= 3);

    /* Kardiyonun videosu yok ve bu bir eksiklik değil — panel de öyle
       demeli, "video henüz yok" diye şikâyet etmemeli. */
    d.querySelector('#warm [data-warm="warm-cardio"]').click();
    ok("videosuz ısınma satırı eksiklik bildirmiyor",
       !d.querySelector("#sheet-body .videoslot") && !d.querySelector("#sheet-body .note"));

    /* Soğuma bitiş sayfasında tek düğme, panelde üç hareket. */
    d.getElementById("tocool").click();
    ok("soğuma paneli üç hareket gösteriyor",
       d.querySelectorAll("#sheet-body .coolpart").length === 3,
       d.querySelectorAll("#sheet-body .coolpart").length + " bölüm");
    ok("soğuma esnemelerinin videosu bağlı",
       d.querySelectorAll("#sheet-body .videoslot").length === 2,
       d.querySelectorAll("#sheet-body .videoslot").length + " video");

    var pager = d.getElementById("pager");
    var page = d.querySelector(".page.dyn");
    ok("sayfa tam genişlikte",
       Math.abs(page.getBoundingClientRect().width - pager.clientWidth) < 1,
       page.getBoundingClientRect().width + " vs " + pager.clientWidth);

    /* her sekmede tek görünüm — id özgüllüğü kaynaklı bindirme nüksetmesin */
    var tabs = ["antrenman","ogun","gecmis","rehber","profil"];
    tabs.forEach(function(t){
      d.getElementById("tab-" + t).click();
      var on = visibleViews(d);
      ok(t + ": tek görünüm açık", on.length === 1 && on[0] === t, "açık olanlar: " + on.join(","));
      var bad = hiddenBoxes(d, t);
      ok(t + ": gizli görünümler 0x0", bad.length === 0, bad.join(", "));
    });

    d.getElementById("tab-antrenman").click();
    var pg = d.getElementById("ex-0");
    ok("hareket sayfası taşmıyor (390x844)",
       pg.scrollHeight <= pg.clientHeight + 1,
       pg.scrollHeight + " > " + pg.clientHeight);

    /* ---- seviye değişimi ---- */
    d.getElementById("tab-profil").click();
    d.querySelector('[data-level="3"]').click();
    ok("3. seviyede 3 gün", d.querySelectorAll('#days [data-day]').length === 3,
       d.querySelectorAll('#days [data-day]').length + " gün");
    ok("3. seviye A günü 5 hareket", d.querySelectorAll(".page.dyn").length === 5,
       d.querySelectorAll(".page.dyn").length + " sayfa");
    ok("seviye kaydedildi", JSON.parse(localStorage.getItem("zirh.v1")).profile.erkek.level === 3);

    /* gün değişimi */
    d.querySelectorAll('#days [data-day]')[2].click();
    ok("bacak gününe geçildi", d.getElementById("h-title").textContent === "Bacak",
       d.getElementById("h-title").textContent);

    /* Isınma güne göre değişmeli: bacak gününde kalça açma çıkmalı,
       omuz işi çıkmamalı. Eskiden her gün aynı üç satırdı. */
    ok("bacak gününde kalça ısınması var", !!d.querySelector('#warm [data-warm="hip-mobility"]'));
    ok("bacak gününde omuz ısınması yok", !d.querySelector('#warm [data-warm="shoulder-mobility"]'));

    /* ---- set işaretleme ve kalıcılık ---- */
    d.getElementById("tab-antrenman").click();
    d.querySelector('#ex-0 .setbtn').click();
    var saved = JSON.parse(localStorage.getItem("zirh.v1"));
    ok("set kaydedildi", !!(saved.active.erkek["3:B"] && saved.active.erkek["3:B"].sets["0-0"]),
       JSON.stringify(saved.active.erkek));
    ok("dinlenme sayacı açıldı", d.getElementById("timer").classList.contains("on"));

    /* ---- seanstan çıkış yolları ---- */
    d.getElementById("begin").click();
    ok("başlayınca geri düğmesi çıkıyor",
       w.getComputedStyle(d.getElementById("back")).display !== "none");
    d.getElementById("back").click();
    ok("geri düğmesi genel bakışa döndürüyor", d.body.dataset.page === "start");
    ok("set işaretliyken bitiş düğmesi çıkıyor", !d.getElementById("tofinish").hidden);
    var fin = d.getElementById("tofinish").getBoundingClientRect();
    ok("bitiş düğmesi parmak boyutunda", fin.height >= 44, Math.round(fin.height) + "px");
    ok("genel bakışta geri düğmesi gizli",
       w.getComputedStyle(d.getElementById("back")).display === "none");

    ok("rayda bitiş kısayolu var", !!d.querySelector('#rail [data-jump="end"]'));
    d.querySelector('#rail [data-jump="end"]').click();
    /* scrollLeft'e bakılmıyor: headless tarayıcı behavior:"smooth" kaydırmayı
       çalıştırmıyor. Rayın işareti ise sayfa göstergesiyle birlikte anında
       güncelleniyor, dolayısıyla asıl durumu o taşıyor. */
    ok("bitiş kısayolu son sayfayı işaretliyor",
       d.querySelector("#rail .railend").classList.contains("now"));
    ok("seansı silme düğmesi var", !!d.getElementById("discard"));

    /* Geri düğmesi başka sekmelerde görünmemeli: sayfalayıcı orada
       görünmediği için basılıyor ama ekranda hiçbir şey olmuyordu. */
    d.getElementById("begin").click();
    d.getElementById("tab-ogun").click();
    ok("geri düğmesi öğün sekmesinde gizli",
       w.getComputedStyle(d.getElementById("back")).display === "none");
    d.getElementById("tab-antrenman").click();
    ok("antrenmana dönünce geri düğmesi geliyor",
       w.getComputedStyle(d.getElementById("back")).display !== "none");

    /* Dokunma hedefleri parmak boyutunda olmalı. */
    var endBtn = d.querySelector("#rail .railend").getBoundingClientRect();
    ok("ray bitiş hedefi yeterince büyük",
       endBtn.height >= 30 && endBtn.width >= 28,
       Math.round(endBtn.width) + "x" + Math.round(endBtn.height));
    var grp = d.querySelector("#rail .railgroup").getBoundingClientRect();
    ok("ray hareket hedefi yeterince yüksek", grp.height >= 26, Math.round(grp.height) + "px");

    d.getElementById("begin").click();

    /* ---- teknik paneli ve video ---- */
    d.querySelector('#ex-0 [data-tech]').click();
    ok("teknik paneli açıldı", d.getElementById("sheet").classList.contains("on"));
    ok("panelde teknik adımları var", d.querySelectorAll("#sheet-body ol li").length >= 3);
    ok("panelde sık hata var", !!d.querySelector("#sheet-body .warnbox"));
    var slot = d.querySelector("#sheet-body .videoslot");
    ok("hareketin videosu bağlı", !!slot && /^[A-Za-z0-9_-]{11}$/.test(slot.dataset.vid),
       slot ? slot.dataset.vid : "yok");
    /* Video ancak düğmeye basılınca yüklenir. Gerçekten gömmeyi burada
       denemiyoruz: headless tarayıcı YouTube isteğini bekleyip kilitleniyor.
       Kimliklerin geçerliliği ayrıca oembed ile doğrulanıyor. */
    ok("video isteğe bağlı yükleniyor", !d.querySelector("#sheet-body iframe"));
    ok("video düğmesi hazır", !!d.querySelector("#sheet-body .vbtn"));
    /* Panel burada kapatılmıyor: kapatma history.back() çağırıyor ve iframe
       içinde bu üst pencereyi de geri götürüp test sayfasını düşürüyor.
       Sonraki denetimler doğrudan DOM üzerinden, panelden bağımsız. */

    /* ---- ağırlık artırma ---- */
    d.querySelector('#ex-0 [data-step="0"][data-dir="1"]').click();
    ok("ağırlık adımı 5 kg (back squat)",
       d.querySelector('#ex-0 [data-kg="0"]').value === "5",
       d.querySelector('#ex-0 [data-kg="0"]').value);

    f.remove();
    return frame(320, 568);
  }).then(function(f){
    /* ---- 2. küçük ekran ---- */
    var d = f.contentDocument;
    var pg = d.getElementById("ex-0");
    ok("hareket sayfası taşmıyor (320x568)",
       pg.scrollHeight <= pg.clientHeight + 1,
       pg.scrollHeight + " > " + pg.clientHeight);

    var fp = d.getElementById("page-finish");
    ok("bitiş sayfası taşmıyor (320x568)",
       fp.scrollHeight <= fp.clientHeight + 1,
       fp.scrollHeight + " > " + fp.clientHeight);

    /* "Taşmıyor" testi tek başına yetmiyor: sayfa flex kolon olduğu
       için sığmayan içerik taşmak yerine kartı eziyordu — sayfa temiz
       görünürken ilerleme çubuğu kartın dışında kalıyordu. Onun için
       kritik parçaların gerçekten görünür olduğuna ayrıca bakılıyor. */
    var hero = d.querySelector("#page-start .hero");
    var prog = d.querySelector("#page-start .heroprog");
    ok("ilerleme çubuğu kartın içinde (320x568)",
       prog.getBoundingClientRect().bottom <= hero.getBoundingClientRect().bottom + 1,
       Math.round(prog.getBoundingClientRect().bottom) + " > " +
       Math.round(hero.getBoundingClientRect().bottom));

    var ps = d.getElementById("page-start");
    ok("başla düğmesi ekranın içinde (320x568)",
       d.getElementById("begin").getBoundingClientRect().bottom <=
       ps.getBoundingClientRect().bottom + 1);
    ok("ısınmanın son satırı ekranın içinde (320x568)",
       d.querySelector("#warm li:last-child").getBoundingClientRect().bottom <=
       ps.getBoundingClientRect().bottom + 1);

    /* seviye 3 hâlâ kayıtlı olmalı */
    ok("seviye yeniden yüklemede korundu",
       d.querySelectorAll('#days [data-day]').length === 3);

    /* yarım kalan seans hatırlanıyor */
    ok("yarım seans işaretli kaldı",
       d.querySelector('#ex-0 .setbtn').getAttribute("aria-pressed") === "true");

    f.remove();

    /* ---- 3. profil dolu → öğün planı ---- */
    var s = JSON.parse(localStorage.getItem("zirh.v1"));
    s.profile.erkek.h = "178";
    s.profile.erkek.w = "80";
    s.profile.erkek.age = "33";
    s.profile.erkek.goal = "kas";
    localStorage.setItem("zirh.v1", JSON.stringify(s));

    return frame(390, 844);
  }).then(function(f){
    var d = f.contentDocument;

    d.getElementById("tab-profil").click();
    var kcal = d.getElementById("t-kcal").textContent;
    ok("kalori hedefi hesaplandı", /\d/.test(kcal), kcal);
    ok("protein hedefi hesaplandı", d.getElementById("t-pro").textContent === "144 g",
       d.getElementById("t-pro").textContent);
    ok("VKİ hesaplandı", d.getElementById("t-bmi").textContent === "25,2",
       d.getElementById("t-bmi").textContent);

    d.getElementById("tab-ogun").click();
    ok("öğün planı kuruldu", d.querySelectorAll("#m-plan .meal").length >= 4,
       d.querySelectorAll("#m-plan .meal").length + " öğün");
    ok("plan göstergeleri var", d.querySelectorAll("#m-plan .gauge").length === 4);

    var planKcal = 0;
    d.querySelectorAll("#m-plan .mealnums b").forEach(function(b){ planKcal += +b.textContent; });
    var goal = +kcal.replace(/\D/g, "");
    ok("plan kalorisi hedefin %20'si içinde",
       Math.abs(planKcal - goal) / goal < 0.20,
       planKcal + " vs " + goal);

    d.getElementById("m-shuffle").click();
    ok("başka gün önerisi çalıştı", d.querySelectorAll("#m-plan .meal").length >= 4);

    /* kişi seçimi profilde ve kayıtları ayırıyor */
    d.getElementById("tab-profil").click();
    ok("kişi seçimi profilde", !!d.querySelector("#v-profil #people"));
    ok("kişi seçimi başlıkta değil", !d.querySelector(".top #people"));

    d.getElementById("p-kadin").click();
    ok("kadına geçildi", d.getElementById("pr-who").textContent === "Kadın",
       d.getElementById("pr-who").textContent);
    ok("kadının ölçüleri boş", d.getElementById("pf-w").value === "",
       d.getElementById("pf-w").value);
    ok("kadın 1. seviyeden başlıyor",
       d.querySelector('[data-level="1"]').getAttribute("aria-pressed") === "true");

    d.getElementById("p-erkek").click();
    ok("erkeğe dönünce ölçüler geldi", d.getElementById("pf-w").value === "80",
       d.getElementById("pf-w").value);

    d.getElementById("tab-ogun").click();
    ok("öğün süzgeci çalışıyor", (function(){
      d.querySelector('[data-filter="ana"]').click();
      var n = d.querySelectorAll("#m-list .meal").length;
      return n > 0 && n < 28;
    })());

    f.remove();

    /* ---- 4. geçmiş: ilerleme grafiği, tahmini 1RM, plato ----

       Geçmiş yalnızca gerçek seanslardan birikiyor; testte 40 günlük
       bir kayıt yığınını doğrudan localStorage'a yazıp uygulamayı
       onunla açıyoruz. Kayıt şeması store.js'teki buildRecord ile
       birebir aynı. */
    var st = JSON.parse(localStorage.getItem("zirh.v1"));
    var DAY = 86400000, t0 = Date.now() - 40 * DAY;
    function item(n, kg, reps, done){
      return { n: n, done: done == null ? 3 : done, total: 3, reps: reps, kg: kg };
    }
    function sess(dayNo, items){
      return { ts: t0 + dayNo * DAY, person: "erkek", level: 1, day: "A",
               title: "İtiş, çekiş, bacak", dur: 45, items: items };
    }
    st.history = [
      /* Leg Press her seansta artıyor: grafik çizilmeli, plato çıkmamalı.
         Shrug süreyle ölçülüyor, Plank vücut ağırlığı. */
      sess(0,  [ item("Leg Press", "40", "10-12"),
                 item("Shrug", "30", "40 sn"),
                 item("Plank", "", "20-40 sn") ]),
      sess(3,  [ item("Leg Press", "45", "10-12") ]),
      sess(6,  [ item("Leg Press", "50", "10-12") ]),
      /* Lat Pulldown üç seanstır aynı ağırlıkta, tekrar da artmıyor. */
      sess(8,  [ item("Lat Pulldown", "35", "10-12") ]),
      sess(11, [ item("Lat Pulldown", "35", "10-12") ]),
      sess(14, [ item("Lat Pulldown", "35", "10-12") ]),
      /* Face Pull aynı ağırlıkta ama hedef tekrar yükseliyor — plato değil. */
      sess(9,  [ item("Face Pull", "15", "10-12") ]),
      sess(12, [ item("Face Pull", "15", "12-15") ]),
      sess(15, [ item("Face Pull", "15", "15") ]),
      /* Hip Thrust tek kayıt: çizilecek bir seyri yok. */
      sess(16, [ item("Hip Thrust", "60", "10-12") ])
    ];
    localStorage.setItem("zirh.v1", JSON.stringify(st));

    return frame(390, 844);
  }).then(function(f){
    var d = f.contentDocument, w = f.contentWindow;
    d.getElementById("tab-gecmis").click();

    function row(name){
      var hit = null;
      d.querySelectorAll("#g-pr .trend").forEach(function(el){
        if(el.querySelector(".tn").textContent === name) hit = el;
      });
      return hit;
    }

    ok("geçmiş özeti 10 seans sayıyor", d.getElementById("g-total").textContent === "10",
       d.getElementById("g-total").textContent);
    ok("ağırlıklı 5 hareket listelendi", d.querySelectorAll("#g-pr .trend").length === 5,
       d.querySelectorAll("#g-pr .trend").length + " satır");
    ok("vücut ağırlığı hareketi listeye girmiyor", !row("Plank"));

    /* En son çalışılan hareket başta: insan en son yaptığı işi arıyor. */
    ok("en son çalışılan hareket başta",
       d.querySelector("#g-pr .trend .tn").textContent === "Hip Thrust",
       d.querySelector("#g-pr .trend .tn").textContent);

    /* ---- grafik ---- */
    ok("üç kayıtlı hareketler grafik çiziyor", d.querySelectorAll("#g-pr .spark").length === 3,
       d.querySelectorAll("#g-pr .spark").length + " grafik");
    var lp = row("Leg Press");
    ok("grafik her kayıt için bir nokta koyuyor",
       lp.querySelector(".spark .line").getAttribute("points").split(" ").length === 3,
       lp.querySelector(".spark .line").getAttribute("points"));
    ok("grafiğin sesli okuyucu karşılığı var",
       /40, 45, 50 kg/.test(lp.querySelector(".spark").getAttribute("aria-label")),
       lp.querySelector(".spark").getAttribute("aria-label"));
    ok("grafik ekran genişliğine uyuyor",
       lp.querySelector(".spark").getBoundingClientRect().width > 200,
       Math.round(lp.querySelector(".spark").getBoundingClientRect().width) + "px");
    /* Sabit renk kodu yazılmadığının kanıtı: çizgi, temanın vurgu
       rengini kullanan yazıyla aynı renge çözülüyor. */
    ok("grafik temanın vurgu rengini kullanıyor",
       w.getComputedStyle(lp.querySelector(".spark .line")).stroke ===
       w.getComputedStyle(lp.querySelector(".tv")).color,
       w.getComputedStyle(lp.querySelector(".spark .line")).stroke + " vs " +
       w.getComputedStyle(lp.querySelector(".tv")).color);

    /* Tek kayıtta çizecek seyir yok; boş kutu bırakmak yerine söylüyor. */
    var ht = row("Hip Thrust");
    ok("tek kayıtlı hareket grafik çizmiyor", !ht.querySelector(".spark"));
    ok("tek kayıtlı hareket durumu açıklıyor", !!ht.querySelector(".tsolo"));

    ok("en iyi ağırlık grafiğin altında kaldı",
       /en iyi 50 kg/.test(lp.querySelector(".tfoot").textContent),
       lp.querySelector(".tfoot").textContent);

    /* ---- tahmini 1RM ---- */
    /* Epley: 50 × (1 + 10/30) = 66,7 → 67. Aralığın alt ucu (10)
       kullanılıyor, tahmin şişmesin. */
    ok("1RM Epley ile hesaplandı", /1RM ≈ 67 kg/.test(lp.querySelector(".tfoot").textContent),
       lp.querySelector(".tfoot").textContent);
    ok("1RM'in tahmin olduğu yazıyor",
       !!d.querySelector("#g-pr .tabout") && /tahmini/.test(d.querySelector("#g-pr .tabout").textContent));
    /* "40 sn" bir tekrar sayısı değil; Epley'e sokulacak bir şey yok.
       Katalogda şu an ağırlıklı-süreli bir hareket bulunmuyor ama alan
       serbest metin, koruma yerinde dursun. */
    ok("süreyle ölçülen harekette 1RM yok", !row("Shrug").querySelector(".t1rm"),
       row("Shrug").textContent);

    /* ---- plato ---- */
    var lat = row("Lat Pulldown");
    ok("üç seans aynı ağırlıkta kalınca plato deniyor", !!lat.querySelector(".tnote"));
    ok("plato notu ne yapılacağını yazıyor",
       /tekrar fazlasını dene/.test(lat.querySelector(".tnote").textContent) &&
       /32,5 kg'a inip/.test(lat.querySelector(".tnote").textContent),
       lat.querySelector(".tnote").textContent);
    ok("ağırlık artıyorsa plato denmiyor", !lp.querySelector(".tnote"));
    ok("tekrar artıyorsa plato denmiyor", !row("Face Pull").querySelector(".tnote"),
       row("Face Pull").textContent);

    f.remove();
    return frame(1280, 900);
  }).then(function(f){
    /* ---- 5. masaüstü ---- */
    var d = f.contentDocument;
    var btns = d.querySelectorAll(".tabs button");
    var first = btns[0].getBoundingClientRect();
    var last = btns[4].getBoundingClientRect();
    var content = d.querySelector("#v-antrenman").getBoundingClientRect();

    ok("alt bar geniş ekranda ortada, gerilmiyor",
       last.right - first.left <= 580,
       Math.round(last.right - first.left) + "px");
    ok("alt bar içerik sütunuyla hizalı",
       Math.abs(first.left - content.left) < 30,
       Math.round(first.left) + " vs " + Math.round(content.left));

    f.remove();
    document.getElementById("out").textContent =
      lines.join("\n") + "\n\nSONUÇ  " + pass + " geçti, " + fail + " kaldı";
  }).catch(function(e){
    document.getElementById("out").textContent =
      lines.join("\n") + "\n\nHATA: " + (e && e.stack ? e.stack : e);
  });
}
run();
</script>
</body></html>
